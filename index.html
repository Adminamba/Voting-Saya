
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlimited Voting 🌈</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #170b32, #48206c, #102d50);
    }

    .container {
      max-width: 900px;
      margin: auto;
      text-align: center;
    }

    h1 {
      font-size: clamp(30px, 6vw, 48px);
      color: #ff80c1;
    }

    .poster {
      width: min(100%, 400px);
      border-radius: 18px;
      box-shadow: 0 0 30px #d64cff66;
    }

    .card {
      margin: 25px auto;
      max-width: 450px;
      padding: 25px;
      border-radius: 20px;
      background: #ffffff15;
      border: 1px solid #ffffff30;
    }

    .count {
      font-size: 55px;
      font-weight: bold;
      color: #ffd36b;
      margin: 15px;
    }

    button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(90deg, #ff70b8, #a875ff);
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      font-size: 14px;
      color: #c9e9ff;
      min-height: 20px;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>🌈 VOTE SEPUASNYA! 🌈</h1>

    <img
      src="adjiOhMyWow.png"
      alt="Poster kandidat"
      class="poster"
    >

    <div class="card">
      <h2>Orang Paling Gay di Dunia</h2>

      <p>Total vote seluruh pengunjung:</p>

      <div class="count" id="count">0</div>

      <button id="voteButton">
        🌈 SAYA VOTE!
      </button>

      <p id="status">Menghubungkan ke server...</p>
    </div>

  </div>

  <script>
    const countElement =
      document.getElementById("count");

    const voteButton =
      document.getElementById("voteButton");

    const statusElement =
      document.getElementById("status");

    let busy = false;

    async function getVotes() {
      try {
        const response = await fetch("/api/votes");

        if (!response.ok) {
          throw new Error("Server error");
        }

        const result = await response.json();

        countElement.textContent =
          Number(result.count).toLocaleString("id-ID");

        statusElement.textContent =
          "Voting berhasil terhubung!";
      } catch (error) {
        statusElement.textContent =
          "Gagal mengambil data vote.";
      }
    }

    voteButton.addEventListener("click", async () => {
      if (busy) return;

      busy = true;
      voteButton.disabled = true;
      voteButton.textContent = "Mengirim vote...";

      try {
        const response = await fetch("/api/votes", {
          method: "POST"
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error);
        }

        countElement.textContent =
          Number(result.count).toLocaleString("id-ID");

        statusElement.textContent =
          "Vote berhasil ditambahkan!";

      } catch (error) {
        statusElement.textContent =
          "Vote gagal. Coba lagi.";
      } finally {
        busy = false;
        voteButton.disabled = false;
        voteButton.textContent = "🌈 SAYA VOTE!";
      }
    });

    getVotes();

    setInterval(getVotes, 5000);
  </script>
</body>
</html>
